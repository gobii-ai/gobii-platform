<header class="sticky top-0 z-50 hs-header transition-all duration-300 !border-none"
        style="background:#17102b"
        x-data="{ scrolled: window.scrollY > 10 }"
        x-init="scrolled = window.scrollY > 10"
        @scroll.window.passive="scrolled = window.scrollY > 10"
        :class="{ 'shadow-lg': scrolled }">

  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center h-16 !border-none">
      <a href="{% url 'pages:home' %}" aria-label="Gobii home" class="text-lg font-bold text-white flex items-center h-10">
        {% include "includes/_header_logo_image.html" %}
      </a>
    </div>
  </div>
</header>
