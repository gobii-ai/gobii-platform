{% extends "allauth/layouts/entrance.html" %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %}{% endblock %}

{% block body_inner %}
<div class="gk-auth-center">
  <div class="gk-auth-glyph gk-auth-glyph-ok" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="9"></circle>
      <path d="m8.2 12.3 2.7 2.7 5-5.4"></path>
    </svg>
  </div>

  <h1 class="gk-auth-title">{% trans "Password Successfully Changed" %}</h1>

  <p class="gk-auth-lede">
    {% trans "Your password has been changed." %}
  </p>

  <div class="gk-auth-actions">
    <a href="{% url 'account_login' %}" class="gk-btn gk-auth-submit">
      {% trans "Sign In" %}
    </a>
  </div>
</div>
{% endblock %}
