<style>
  /* ===== k homepage — Gobii Luxe port. Theme primitives live in includes/_gk_theme.html;

  .gk-astep { display: flex; align-items: center; gap: 12px; background: #fff; border: 1px solid #f0ecfa;

              transition: opacity .4s ease, transform .4s cubic-bezier(.2,.8,.3,1), border-color .3s ease, box-shadow .3s ease; }
  .gk-astep.gk-on { opacity: 1; transform: none; }
