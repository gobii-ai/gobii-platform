<script>
  document.addEventListener('DOMContentLoaded', function () {
    var demoSteps = document.getElementById('gk-demo-steps');
    var demoOut = document.getElementById('gk-demo-out');
    var demoProgress = document.getElementById('gk-demo-progress');
    if (!demoSteps || !demoOut || !demoProgress) return;

    var steps = Array.prototype.slice.call(demoSteps.querySelectorAll('.gk-astep'));
    var candidates = Array.prototype.slice.call(demoOut.querySelectorAll('.gk-cand'));
    var generation = 0;

    var motionReduced = function () {
      if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return true;
      var perf = window.GobiiHomePerf;
      return !!(perf && typeof perf.shouldReduceHomepageMotion === 'function' && perf.shouldReduceHomepageMotion());
    };

    function showFinishedDemo() {
      steps.forEach(function (element) { element.classList.add('gk-on', 'gk-done'); });
      candidates.forEach(function (element) { element.classList.add('gk-on'); });
      demoProgress.style.width = '100%';
    }

    function runDemo() {
      if (motionReduced()) {
        showFinishedDemo();
        return;
      }

      var currentGeneration = ++generation;
      var stepDuration = 700;
      var schedule = function (delay, callback) {
        window.setTimeout(function () {
          if (currentGeneration === generation) callback();
        }, delay);
      };

      steps.forEach(function (element) {
        element.classList.remove('gk-on', 'gk-active', 'gk-done');
      });
      candidates.forEach(function (element) { element.classList.remove('gk-on'); });
      demoProgress.style.width = '0%';

      steps.forEach(function (element, index) {
        schedule(250 + index * stepDuration, function () {
          element.classList.add('gk-on', 'gk-active');
          demoProgress.style.width = (18 * (index + 1)) + '%';
        });
        schedule(250 + (index + 1) * stepDuration - 160, function () {
          element.classList.remove('gk-active');
          element.classList.add('gk-done');
        });
      });

      var candidateStart = 250 + steps.length * stepDuration;
      candidates.forEach(function (element, index) {
        schedule(candidateStart + index * 380, function () {
          element.classList.add('gk-on');
          demoProgress.style.width = (90 + 2.5 * (index + 1)) + '%';
        });
      });
      schedule(candidateStart + candidates.length * 380 + 2600, runDemo);
    }

    if (window.GobiiHomePerf && typeof window.GobiiHomePerf.runWhenIdle === 'function') {
      window.GobiiHomePerf.runWhenIdle(runDemo, 1800);
    } else {
      runDemo();
    }
  });
</script>
